
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>FaarisMart | My Cart</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: "Poppins", sans-serif;
}

body {
    background: #f4f7fb;
}

/* Navbar */
.navbar {
    background: white;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 18px 40px;
    box-shadow: 0 3px 15px rgba(0,0,0,.08);
    position: sticky;
    top: 0;
    z-index: 100;
}

.logo {
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: 26px;
    font-weight: 700;
    color: #2563eb;
    cursor: pointer;
}

.logo img {
    width: 50px;
    height: 50px;
    object-fit: contain;
}

.user-info {
    display: flex;
    align-items: center;
    gap: 20px;
    font-weight: 600;
}

.cart-count {
    background: #2563eb;
    color: white;
    padding: 3px 9px;
    border-radius: 50%;
    font-size: 13px;
}

/* Main */
.container {
    max-width: 1200px;
    margin: 40px auto;
    padding: 0 20px;
}

.container h1 {
    margin-bottom: 25px;
}

.cart-item {
    display: flex;
    align-items: center;
    gap: 25px;
    background: white;
    padding: 20px;
    border-radius: 18px;
    margin-bottom: 18px;
    box-shadow: 0 8px 20px rgba(0,0,0,.06);
}

.cart-item img {
    width: 130px;
    height: 130px;
    object-fit: cover;
    border-radius: 15px;
}

.info {
    flex: 1;
}

.price {
    font-size: 22px;
    font-weight: 700;
    color: #2563eb;
    margin: 10px 0;
}

.qty {
    display: flex;
    align-items: center;
    gap: 12px;
}

.qty button {
    width: 35px;
    height: 35px;
    border: none;
    border-radius: 8px;
    background: #2563eb;
    color: white;
    cursor: pointer;
    font-size: 18px;
}

.qty span {
    font-size: 18px;
    font-weight: 600;
}

.remove {
    background: #ef4444;
    color: white;
    border: none;
    padding: 12px 18px;
    border-radius: 10px;
    cursor: pointer;
}

.summary {
    background: white;
    padding: 25px;
    border-radius: 20px;
    margin-top: 30px;
    box-shadow: 0 8px 20px rgba(0,0,0,.08);
}

.total {
    display: flex;
    justify-content: space-between;
    font-size: 28px;
    font-weight: 700;
    margin: 20px 0;
}

.actions {
    display: flex;
    gap: 15px;
    flex-wrap: wrap;
}

.actions button {
    flex: 1;
    padding: 15px;
    border: none;
    border-radius: 12px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
}

.continue {
    background: #2563eb;
    color: white;
}

.checkout {
    background: #10b981;
    color: white;
}

.empty {
    text-align: center;
    padding: 80px 20px;
}

.empty i {
    font-size: 90px;
    color: #94a3b8;
    margin-bottom: 20px;
}

.empty button {
    margin-top: 20px;
    padding: 12px 22px;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    font-weight: 600;
}

@media (max-width: 768px) {
    .cart-item {
        flex-direction: column;
        text-align: center;
    }

    .actions {
        flex-direction: column;
    }

    .navbar {
        padding: 15px 20px;
    }

    .total {
        font-size: 22px;
    }
}
</style>
</head>

<body>

<script>
/* ==========================================
   LOGIN CHECK
   Supports both localStorage and sessionStorage
========================================== */

const loggedInUser =
    localStorage.getItem("faarisUser") ||
    sessionStorage.getItem("faarisUser");

if (!loggedInUser) {
    window.location.replace("login.html");
}
</script>

<!-- Navbar -->
<nav class="navbar">

    <div class="logo" onclick="window.location.href='index.html'">
        <img src="images/logo.png" alt="FaarisMart Logo">
        <span>FaarisMart</span>
    </div>

    <div class="user-info">

        <span id="username"></span>

        <div>
            <i class="fa-solid fa-cart-shopping"></i>
            <span class="cart-count" id="cartCount">0</span>
        </div>

    </div>

</nav>

<!-- Cart Content -->
<div class="container">

    <h1>
        <i class="fa-solid fa-cart-shopping"></i>
        My Cart
    </h1>

    <div id="cartContainer"></div>

</div>

<script>
/* ==========================================
   USER INFORMATION
========================================== */

const currentUser =
    localStorage.getItem("faarisUser") ||
    sessionStorage.getItem("faarisUser");

document.getElementById("username").innerHTML =
    `<i class="fa-solid fa-user"></i> ${currentUser || "Guest"}`;


/* ==========================================
   CART DATA
========================================== */

let cart = JSON.parse(localStorage.getItem("cart")) || [];

cart = cart.map(item => ({
    ...item,
    quantity: item.quantity || 1
}));


/* ==========================================
   SAVE CART
========================================== */

function saveCart() {
    localStorage.setItem("cart", JSON.stringify(cart));
    updateBadge();
}


/* ==========================================
   UPDATE CART COUNT
========================================== */

function updateBadge() {
    const count = cart.reduce(
        (sum, item) => sum + Number(item.quantity || 1),
        0
    );

    document.getElementById("cartCount").innerText = count;
}


/* ==========================================
   DISPLAY CART ITEMS
========================================== */

function renderCart() {
    const container = document.getElementById("cartContainer");

    container.innerHTML = "";

    if (cart.length === 0) {
        container.innerHTML = `
            <div class="empty">
                <i class="fa-solid fa-cart-shopping"></i>
                <h2>Your Cart is Empty</h2>
                <p>Add products to continue shopping.</p>

                <button class="continue"
                    onclick="window.location.href='index.html'">
                    Continue Shopping
                </button>
            </div>
        `;

        updateBadge();
        return;
    }

    let total = 0;

    cart.forEach((item, index) => {
        const price = Number(item.price) || 0;
        const quantity = Number(item.quantity) || 1;

        total += price * quantity;

        container.innerHTML += `
            <div class="cart-item">

                <img
                    src="images/${item.image}"
                    alt="${item.name || "Product"}"
                    onerror="this.style.display='none'">

                <div class="info">
                    <h3>${item.name || "Product"}</h3>

                    <div class="price">
                        ₹${price.toLocaleString("en-IN")}
                    </div>

                    <div class="qty">
                        <button
                            onclick="changeQty(${index}, -1)"
                            aria-label="Decrease quantity">−</button>

                        <span>${quantity}</span>

                        <button
                            onclick="changeQty(${index}, 1)"
                            aria-label="Increase quantity">+</button>
                    </div>
                </div>

                <button class="remove" onclick="removeItem(${index})">
                    <i class="fa-solid fa-trash"></i>
                    Remove
                </button>

            </div>
        `;
    });

    container.innerHTML += `
        <div class="summary">

            <h2>Order Summary</h2>

            <div class="total">
                <span>Total</span>
                <span>₹${total.toLocaleString("en-IN")}</span>
            </div>

            <div class="actions">

                <button class="continue"
                    onclick="window.location.href='index.html'">
                    Continue Shopping
                </button>

                <button class="checkout" onclick="checkout()">
                    Checkout
                </button>

            </div>

        </div>
    `;

    updateBadge();
}


/* ==========================================
   CHANGE QUANTITY
========================================== */

function changeQty(index, change) {
    if (!cart[index]) return;

    cart[index].quantity =
        Number(cart[index].quantity || 1) + change;

    if (cart[index].quantity <= 0) {
        cart.splice(index, 1);
    }

    saveCart();
    renderCart();
}


/* ==========================================
   REMOVE PRODUCT
========================================== */

function removeItem(index) {
    if (index < 0 || index >= cart.length) return;

    cart.splice(index, 1);

    saveCart();
    renderCart();
}


/* ==========================================
   CHECKOUT
========================================== */

function checkout() {
    if (cart.length === 0) {
        alert("Your cart is empty.");
        return;
    }

    window.location.href = "checkout.html";
}


/* ==========================================
   INITIALIZE CART
========================================== */

renderCart();
</script>

</body>
</html>
