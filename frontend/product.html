<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>FaarisMart | Product Details</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:"Poppins",sans-serif;
}

body{
background:#f4f7fb;
color:#1e293b;
}

/* NAVBAR */

.navbar{
position:sticky;
top:0;
display:flex;
justify-content:space-between;
align-items:center;
padding:18px 40px;
background:rgba(255,255,255,.8);
backdrop-filter:blur(20px);
box-shadow:0 5px 15px rgba(0,0,0,.08);
z-index:100;
}

.logo{
display:flex;
align-items:center;
gap:10px;
cursor:pointer;
}

.logo img{
width:45px;
}

.logo span{
font-size:26px;
font-weight:700;
color:#2563eb;
}

.back-btn{
background:#2563eb;
color:white;
border:none;
padding:12px 22px;
border-radius:12px;
cursor:pointer;
}

/* MAIN */

.container{
max-width:1300px;
margin:40px auto;
padding:0 25px;
}

.product{
display:grid;
grid-template-columns:1fr 1fr;
gap:45px;
background:white;
padding:35px;
border-radius:28px;
box-shadow:0 12px 30px rgba(0,0,0,.08);
}

.image-box{
background:#f8fafc;
display:flex;
justify-content:center;
align-items:center;
padding:30px;
border-radius:20px;
}

.image-box img{
width:100%;
max-width:420px;
height:420px;
object-fit:contain;
transition:.3s;
}

.image-box img:hover{
transform:scale(1.05);
}

.details h1{
font-size:34px;
margin-bottom:15px;
}

.rating{
color:#f59e0b;
font-size:18px;
margin-bottom:15px;
}

.price{
font-size:38px;
font-weight:700;
color:#2563eb;
margin-bottom:15px;
}

.stock{
display:inline-block;
padding:8px 14px;
border-radius:20px;
font-weight:600;
margin-bottom:20px;
}

.instock{
background:#dcfce7;
color:#166534;
}

.outstock{
background:#fee2e2;
color:#991b1b;
}

.desc{
line-height:1.8;
color:#475569;
margin-bottom:25px;
}

/* Quantity */

.quantity-box{
display:flex;
align-items:center;
gap:15px;
margin-bottom:25px;
}

.quantity-box button{
width:40px;
height:40px;
border:none;
border-radius:10px;
background:#2563eb;
color:white;
font-size:20px;
cursor:pointer;
}

.quantity-box span{
font-size:20px;
font-weight:600;
min-width:30px;
text-align:center;
}

/* Features */

.features{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:15px;
margin-bottom:30px;
}

.feature{
background:#f8fafc;
padding:15px;
border-radius:14px;
display:flex;
align-items:center;
gap:10px;
}

/* Buttons */

.buttons{
display:flex;
gap:15px;
flex-wrap:wrap;
}

.buttons button{
flex:1;
padding:16px;
border:none;
border-radius:14px;
font-size:16px;
font-weight:600;
cursor:pointer;
transition:.3s;
}

.add{
background:#2563eb;
color:white;
}

.buy{
background:#10b981;
color:white;
}

.buttons button:hover{
transform:translateY(-3px);
}

/* Related */

.related{
max-width:1300px;
margin:50px auto;
padding:0 25px;
}

.related h2{
margin-bottom:25px;
}

.related-grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:22px;
}

.related-card{
background:white;
padding:18px;
border-radius:18px;
text-align:center;
box-shadow:0 10px 25px rgba(0,0,0,.08);
cursor:pointer;
transition:.3s;
}

.related-card:hover{
transform:translateY(-6px);
}

.related-card img{
width:140px;
height:140px;
object-fit:contain;
margin-bottom:15px;
}

/* Loader */

.loader{
width:55px;
height:55px;
border:6px solid #ddd;
border-top-color:#2563eb;
border-radius:50%;
animation:spin 1s linear infinite;
margin:100px auto;
}

@keyframes spin{
to{transform:rotate(360deg);}
}

@media(max-width:900px){

.product{
grid-template-columns:1fr;
}

.features{
grid-template-columns:1fr;
}

.buttons{
flex-direction:column;
}

}

</style>

</head>

<body>

<nav class="navbar">

<div class="logo" onclick="window.location.href='index.html'">

<img src="images/logo.png">

<span>FaarisMart</span>

</div>

<button class="back-btn" onclick="history.back()">

<i class="fa-solid fa-arrow-left"></i>

Back

</button>

</nav>

<div class="container" id="productContainer">

<div class="loader"></div>

</div>

<section class="related">

<h2>You May Also Like</h2>

<div id="relatedProducts" class="related-grid"></div>

</section>

<script src="js/api.js"></script>

<script>

const id=new URLSearchParams(window.location.search).get("id");

let currentProduct=null;

let quantity=1;

// ---------------- Load Product ----------------

async function loadProduct(){

try{

const products=await apiGet("/products");

currentProduct=products.find(p=>p.id==id);

if(!currentProduct){

document.getElementById("productContainer").innerHTML=
"<h2>Product Not Found</h2>";

return;

}

renderProduct();

renderRelated(products);

}catch{

document.getElementById("productContainer").innerHTML=
"<h2>Backend not connected.</h2>";

}

}

// ---------------- Render Product ----------------

function renderProduct(){

const stockClass=currentProduct.stock>0?"instock":"outstock";

const stockText=currentProduct.stock>0?
`In Stock (${currentProduct.stock})`:
"Out of Stock";

document.getElementById("productContainer").innerHTML=`

<div class="product">

<div class="image-box">

<img src="images/${currentProduct.image}">

</div>

<div class="details">

<h1>${currentProduct.name}</h1>

<div class="rating">

⭐ ${currentProduct.rating} Rating

</div>

<div class="price">

₹${Number(currentProduct.price).toLocaleString("en-IN")}

</div>

<div class="stock ${stockClass}">

${stockText}

</div>

<p class="desc">

${currentProduct.description}

</p>

<div class="quantity-box">

<button onclick="changeQty(-1)">−</button>

<span id="qty">1</span>

<button onclick="changeQty(1)">+</button>

</div>

<div class="features">

<div class="feature">

<i class="fa-solid fa-truck-fast"></i>

Free Delivery

</div>

<div class="feature">

<i class="fa-solid fa-shield"></i>

Secure Payment

</div>

<div class="feature">

<i class="fa-solid fa-rotate-left"></i>

7-Day Return

</div>

<div class="feature">

<i class="fa-solid fa-award"></i>

1 Year Warranty

</div>

</div>

<div class="buttons">

<button class="add" onclick="addToCart()">

<i class="fa-solid fa-cart-shopping"></i>

Add to Cart

</button>

<button class="buy" onclick="buyNow()">

<i class="fa-solid fa-bolt"></i>

Buy Now

</button>

</div>

</div>

</div>

`;

}

// ---------------- Related ----------------

function renderRelated(products){

const container=document.getElementById("relatedProducts");

container.innerHTML="";

products
.filter(p=>p.id!=id)
.slice(0,4)
.forEach(p=>{

container.innerHTML+=`

<div class="related-card"
onclick="window.location='product.html?id=${p.id}'">

<img src="images/${p.image}">

<h4>${p.name}</h4>

<p>₹${Number(p.price).toLocaleString("en-IN")}</p>

</div>

`;

});

}

// ---------------- Quantity ----------------

function changeQty(change){

quantity+=change;

if(quantity<1)
quantity=1;

document.getElementById("qty").innerText=quantity;

}

// ---------------- Cart ----------------

function addToCart(){

let cart=JSON.parse(localStorage.getItem("cart"))||[];

const existing=cart.find(item=>item.id==currentProduct.id);

if(existing){

existing.quantity+=quantity;

}else{

cart.push({

...currentProduct,

quantity

});

}

localStorage.setItem("cart",JSON.stringify(cart));

alert(quantity+" × "+currentProduct.name+" added to cart!");

}

// ---------------- Buy ----------------

function buyNow(){

addToCart();

window.location.href="checkout.html";

}

loadProduct();

</script>

</body>
</html>
